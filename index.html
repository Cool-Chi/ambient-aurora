/*
 * schema/helpers.js - shared building blocks for the per-tab settings schema
 *
 * Responsibility
 *   Validators, formatters and shared apply-hooks used by schema/clock.js, schema/background.js and
 *   schema/system.js. Loaded before those files; has no DOM or state side effects at load time.
 *
 * Exports: AA.SCHEMA_HELPERS
 *   Validators   isBool, isInt(lo, hi), isNum(lo, hi), isHex, isRgb, oneOf(list)
 *   Formatters   fmtInt, fmtPct, fmtSigned
 *   Hooks        syncFpsHook   shared by showFps / showScale / bgRenderScale (same function reference,
 *                              so syncUI runs it once per sync via its hook de-dupe set)
 *                anchorHook    applies clockAnchor CSS vars and the anchor grid active state
 *
 * Co-change guide
 *   New validator / formatter / shared hook -> here, then destructure it in the schema file that uses it
 *   Entry-specific one-off hooks and normalize functions stay inline in their schema entry
 *   Per-tab entries -> schema/clock.js (tab 0), schema/background.js (tab 1), schema/system.js (tab 2 + shell)
 */
(function (AA) {
  const isBool = v => typeof v === 'boolean';
  const isInt = (lo, hi) => v => typeof v === 'number' && Number.isInteger(v) && v >= lo && v <= hi;
  const isNum = (lo, hi) => v => typeof v === 'number' && Number.isFinite(v) && v >= lo && v <= hi;
  const isHex = v => typeof v === 'string' && /^#[0-9A-Fa-f]{6}$/.test(v);
  const isRgb = v => Array.isArray(v) && v.length === 3 && v.every(x => typeof x === 'number' && Number.isFinite(x) && x >= 0 && x <= 1);
  const oneOf = list => v => list.includes(v);

  const fmtInt = v => String(Math.round(v));
  const fmtPct = v => Math.round(v * 100) + '%';
  const fmtSigned = v => (v > 0 ? '+' : '') + Math.round(v);

  const syncFpsHook = (v, s, ui) => ui.syncFps(!!s.showFps);

  const anchorHook = val => {
    const ax = val % 3;
    const ay = Math.floor(val / 3);
    const F = ['flex-start', 'center', 'flex-end'];
    const O = ['4vmin', '50%', 'calc(100% - 4vmin)'];
    const st = document.documentElement.style;
    st.setProperty('--pos-x', F[ax]);
    st.setProperty('--pos-y', F[ay]);
    st.setProperty('--ox', O[ax]);
    st.setProperty('--oy', O[ay]);
    document.querySelectorAll('.anchor-btn').forEach((b, i) => {
      b.classList.toggle('active', i === val);
      b.setAttribute('aria-checked', i === val ? 'true' : 'false');
    });
  };

  AA.SCHEMA_HELPERS = {
    isBool,
    isInt,
    isNum,
    isHex,
    isRgb,
    oneOf,
    fmtInt,
    fmtPct,
    fmtSigned,
    syncFpsHook,
    anchorHook
  };
})(window.AA);

/*
 * ui-config.js - settings schema assembler and derived lookups
 *
 * Responsibility
 *   Assembles SETTINGS_SCHEMA from the per-tab files (schema/clock.js, schema/background.js,
 *   schema/system.js), pulls the static asset tables from ui-assets.js, and builds the derived lookups
 *   (SCHEMA_BY_KEY, DEPENDENTS_BY_KEY, UI_BINDINGS, BINDING_BY_ID) plus buildDefaultState().
 *
 * Load order: modes/*.js -> schema/helpers.js -> schema/clock.js -> schema/background.js
 *             -> schema/system.js -> ui-assets.js -> ui-config.js
 *
 * Exports: AA.UI_CONFIG = { FONTS, THEMES, UI_ICONS, GLASS_FX_IDS, SETTINGS_SCHEMA, SCHEMA_BY_KEY,
 *                           DEPENDENTS_BY_KEY, UI_BINDINGS, BINDING_BY_ID, buildDefaultState }
 *
 * Co-change guide
 *   Add / edit a setting      -> the matching schema/<tab>.js (SETTINGS_SCHEMA order = tab, block, position)
 *   Shared validator/formatter -> schema/helpers.js
 *   Fonts / themes / icons / glass filter ids -> ui-assets.js
 *   New control type bound to a DOM prop -> BOUND_PROP below + controls-registry.js + gesture-manager.js
 */
(function (AA) {
  const { FONTS, THEMES, UI_ICONS, GLASS_FX_IDS } = AA.UI_ASSETS;

  /*
   * Setting key naming convention (SETTINGS_SCHEMA is the single source of truth)
   *
   * Rule 1 (is*): State & feature toggles use is*
   *   (is24Hour, isLeadingZero, isLowPower, isNightMode, isPixelShift, isDimOnIdle,
   *    isBgColorMix, isBgHueDrift, isBgModeCycle).
   *   NOTE: transient runtime flags (isIdle, isHolding, isPanelOpen) also start with is*,
   *   so Store.TRANSIENT_KEYS MUST always be an explicit Set and never inferred by prefix.
   * Rule 2 (show*): Visibility / display toggles use show*
   *   (showSeconds, showDate, showYear, showMonth, showDay, showWeekday,
   *    showCustomText, showFps, showScale, showSliderVal).
   * Rule 3 (clock*, bg*, date*, lang, idleTimeout): all other settings use their group prefix
   *   (clock* for clock typography/color/layout/position, bg* for the WebGL background,
   *    date* for date layout, plus system-level lang and idleTimeout).
   *
   * One setting = one entry: key, default, validate, type, tab, block, id, label, ...
   * Entries are listed in render order (tab, then block, then position inside the block).
   * dependsOn: key of a boolean setting that controls this row's visibility.
   * normalize: optional (v => v), applied by Store.validate / Store.setState after validate() passes.
   *
   * How to add a standard setting:
   *   1. Pick a key name following Rule 1 / 2 / 3.
   *   2. Add one entry in SETTINGS_SCHEMA with key, default, validate, type, tab, block, id, label
   *      (plus optional dependsOn / apply / normalize).
   *   3. If the engine or clock controller needs it, subscribe to the key in webgl-engine.js
   *      or clock-controller.js.
   *
   * The bgMode entry is generated from the mode registry (AA.MODES / AA.MODE_IDS); add a new background
   * mode by registering it in js/webgl-engine/modes/ rather than editing this file.
   */
  const SETTINGS_SCHEMA = [...AA.SCHEMA_CLOCK, ...AA.SCHEMA_BACKGROUND, ...AA.SCHEMA_SYSTEM];

  const SCHEMA_BY_KEY = Object.fromEntries(SETTINGS_SCHEMA.map(e => [e.key, e]));

  const DEPENDENTS_BY_KEY = {};
  SETTINGS_SCHEMA.forEach(e => {
    if (e.dependsOn) {
      (DEPENDENTS_BY_KEY[e.dependsOn] = DEPENDENTS_BY_KEY[e.dependsOn] || []).push(e);
    }
  });

  const BOUND_PROP = { slider: 'value', toggle: 'checked', 'custom-text': 'value' };

  const UI_BINDINGS = Object.fromEntries(
    SETTINGS_SCHEMA
      .filter(e => BOUND_PROP[e.type] && e.id)
      .map(e => {
        const b = { id: e.id, prop: BOUND_PROP[e.type] };
        if (e.apply && e.apply.cssVar) {
          b.cssVar = e.apply.cssVar;
          if (e.apply.cssFormat) b.format = e.apply.cssFormat;
        }
        return [e.key, b];
      })
  );

  const BINDING_BY_ID = Object.assign(
    Object.create(null),
    Object.fromEntries(
      Object.entries(UI_BINDINGS).map(([k, b]) => [b.id, [k, b]])
    )
  );

  const buildDefaultState = () => {
    const state = {};
    SETTINGS_SCHEMA.forEach(e => {
      state[e.key] = Array.isArray(e.default) ? e.default.slice() : e.default;
    });
    return Object.assign(state, { isIdle: false, isHolding: false, isPanelOpen: false });
  };

  AA.UI_CONFIG = {
    FONTS,
    THEMES,
    UI_ICONS,
    GLASS_FX_IDS,
    SETTINGS_SCHEMA,
    SCHEMA_BY_KEY,
    DEPENDENTS_BY_KEY,
    UI_BINDINGS,
    BINDING_BY_ID,
    buildDefaultState
  };
})(window.AA);

      const lw = this.lastUploadedWeights;
      let weightsChanged = false;
      for (let i = 0; i < cw.length; i++) {

          lw[i] = cw[i];
        }
      }
      if (weightsChanged) this.gl.uniform1fv(this.uniforms.u_weights, cw);

      this.gl.uniform1f(this.uVignetteLoc, this.currentVignette);

        this.idleStartTime = 0;
        this.isDeepIdle = false;
      } else {
        if (this.idleStartTime === 0) this.idleStartTime = timestamp;
        this.isDeepIdle = (timestamp - this.idleStartTime) >= ENGINE_CFG.DEEP_IDLE_MS;
      }

      const effectiveSpeed = bgSpeed * (this.reducedMotion ? ENGINE_CFG.REDUCED_MOTION_MUL : 1);
      if (effectiveSpeed > ENGINE_CFG.SPEED_UP_THRESH) this.highSpeedFps = true;
      else if (effectiveSpeed < ENGINE_CFG.SPEED_DOWN_THRESH) this.highSpeedFps = false;

      const speedInterval = this.highSpeedFps ? ENGINE_CFG.FPS_HIGH_MS : ENGINE_CFG.FPS_BASE_MS;
      const idleInterval = !isIdle ? 0 : (this.isDeepIdle ? ENGINE_CFG.FPS_DEEP_IDLE_MS : ENGINE_CFG.FPS_IDLE_MS);
      const minInterval = Math.max(
        idleInterval,
        isLowPower ? ENGINE_CFG.FPS_LOW_POWER_MS : 0,
        isPanelOpen ? ENGINE_CFG.FPS_BASE_MS : 0,
        speedInterval
      );

      if (this.lastMinInterval !== minInterval) {
        this.lastMinInterval = minInterval;
        this.frameClock = timestamp - minInterval;
        this.emaFrameDt = minInterval;
        this.overloadTime = 0;
        this.stableTime = 0;

      if (timestamp < this.frameClock + minInterval - ENGINE_CFG.FRAME_JITTER_MS) return null;
      this.frameClock += minInterval;
      if (timestamp - this.frameClock > minInterval) this.frameClock = timestamp;

      const rawDt = timestamp - this.lastTime;
      const dt = clamp(rawDt, 0, ENGINE_CFG.MAX_DT_MS);
      const k = 1 - Math.pow(1 - ENGINE_CFG.SMOOTH_BASE, dt / ENGINE_CFG.REF_FRAME_MS);

      this.globalTime += step;

        this.isWrapping = true;
        this.wrapTime = 0;
        this.wrapProgress = 0;
      }
      if (this.isWrapping) {

        this.wrapProgress += dt / ENGINE_CFG.WRAP_DURATION_MS;

    stepModeCycle(dt) {

      if (!isBgModeCycle || AA.MODE_IDS.length === 0) return;
      this.cycleElapsed += dt;
      const limit = ENGINE_CFG.CYCLE_INTERVALS_MS[bgCycleInterval];

    stepColorsAndScene(dt, k) {
      const {
        isIdle,
        isNightMode,
        bgColor,
        isHolding,
        bgBrightness,
        isDimOnIdle,
        bgVignette,
        isBgHueDrift
      } = this.params;

      if (!isBgHueDrift) {
        this.driftPhase = 0;
      } else if (!isNightMode) {

      const target = isNightMode
        ? NIGHT_COLOR
        : (isBgHueDrift ? this.driftedPrimary : bgColor);
      for (let i = 0; i < 3; i++) this.colorLive[i] += (target[i] - this.colorLive[i]) * k;

      const target2 = drifting ? this.driftedColor2 : this.cachedColor2;
      for (let i = 0; i < 3; i++) this.color2Live[i] += (target2[i] - this.color2Live[i]) * k;

      this.currentBrightness += (
        (isHolding
          ? ENGINE_CFG.BRIGHT_HOLD
          : (isIdle && isDimOnIdle)
            ? bgBrightness * (this.isDeepIdle ? ENGINE_CFG.BRIGHT_DEEP_IDLE_MUL : ENGINE_CFG.BRIGHT_IDLE_MUL)
            : bgBrightness) - this.currentBrightness
      ) * k;

      const targetVignette = ENGINE_CFG.VIGNETTE_MAP[bgVignette];
      this.currentVignette += (targetVignette - this.currentVignette) * k;

      let wSum = 0;
      for (let i = 0; i < len; i++) {
        let w = this.currentWeights[i] + (this.targetWeights[i] - this.currentWeights[i]) * k;
        if (this.targetWeights[i] === 0 && w < ENGINE_CFG.WEIGHT_SNAP_EPS) w = 0;
        this.currentWeights[i] = w;
        wSum += w;
      }
      if (wSum > 0) {
        let active = 0;
        for (let i = 0; i < len; i++) {
          const nw = this.currentWeights[i] / wSum;
          this.currentWeights[i] = nw;
          if (nw > ENGINE_CFG.ACTIVE_MODE_EPS) active++;
        }
        this.activeModeCount = active;
      } else {

      }
    }

    // Auto render-scale controller. Returns true when the scale changed (resize already drew).
    stepAutoScale(timestamp, rawDt, minInterval) {
      const { bgRenderScale, isIdle, isPanelOpen } = this.params;

      const autoActive = bgRenderScale === 'auto' && !isIdle && !isPanelOpen;
      if (
        rawDt > ENGINE_CFG.AUTO_MAX_RAW_DT ||
        timestamp < this.autoIgnoreUntil ||
        this.activeModeCount > 1 ||
        this.isWrapping ||

        this.emaFrameDt = minInterval;
        this.overloadTime = 0;
        this.stableTime = 0;
        return false;

      this.emaFrameDt += (rawDt - this.emaFrameDt) * ENGINE_CFG.AUTO_EMA_ALPHA;
      if (this.emaFrameDt > minInterval * ENGINE_CFG.AUTO_OVERLOAD_RATIO) {
        this.overloadTime += rawDt;
        this.stableTime = 0;
      } else if (this.emaFrameDt <= minInterval * ENGINE_CFG.AUTO_STABLE_RATIO) {
        this.stableTime += rawDt;
        this.overloadTime = Math.max(0, this.overloadTime - rawDt * ENGINE_CFG.AUTO_OVERLOAD_DECAY);

      // Two full minutes since the last upgrade without a downgrade: forget the doubled upgrade threshold
      if (this.lastAutoUpTime > 0 && (timestamp - this.lastAutoUpTime) >= ENGINE_CFG.AUTO_UP_RESET_MS) {
        this.autoUpRequiredMs = ENGINE_CFG.AUTO_UP_MS;
        this.lastAutoUpTime = 0;
      }

      if (timestamp >= this.autoCooldownUntil) {
        const ti = SCALE_TIERS.indexOf(this.autoScale);
        if (this.overloadTime >= ENGINE_CFG.AUTO_DOWN_MS && this.autoScale > 0.25) {
          if (this.lastAutoUpTime > 0 && (timestamp - this.lastAutoUpTime) <= ENGINE_CFG.AUTO_FLAP_WINDOW_MS) {
            this.autoUpRequiredMs = Math.min(this.autoUpRequiredMs * 2, ENGINE_CFG.AUTO_UP_MAX_MS);
          }
          this.lastAutoUpTime = 0;
          this.autoScale = SCALE_TIERS[Math.max(0, ti - 1)];
          this.autoCooldownUntil = timestamp + ENGINE_CFG.AUTO_COOLDOWN_DOWN_MS;
          this.overloadTime = 0;
          this.stableTime = 0;
          this.emaFrameDt = minInterval;
          this.resize();

          this.overloadTime = 0;
          this.stableTime = 0;
          this.emaFrameDt = minInterval;
          this.resize();
          return true;
        }

      return false;
    }

    render(timestamp) {

/*
 * modes/diagnostics.js - developer-only diagnostics for registered background modes
 *
 * NOT used at runtime by the app. Call AA.diagnoseModes() from the browser console.
 *
 * Exports: AA.diagnoseModes() -> { bootCompileMs, fullCompileMs, modes: [{ id, passed, avgLuminance, frameMs, compileMs }], error? }
 *
 * What it does
 *   For every mode in AA.MODES it builds a standalone single-mode fragment shader
 *   (AA.SHADERS.buildFragmentSource({ modes: [mode], outLineMap })), compiles and links it in a private
 *   offscreen WebGL2 context (the app's context and AA.SHADERS.lastLineMap are never touched), renders it
 *   with fixed deterministic uniforms and reports:
 *     passed        compile + link succeeded (compile errors are logged with mode id and mode-local line)
 *     avgLuminance  average relative luminance of the frame (0..1, 4 decimals)
 *     frameMs       estimated single draw time over a timed batch (3 decimals)
 *     compileMs     compile + link time of the single-mode shader (2 decimals)
 *   bootCompileMs is AA._bootCompileMs written by WebGLEngine.initGL (null if the engine has not booted
 *   GL yet); fullCompileMs is a fresh compile + link of the full all-modes shader in the offscreen context.
 *
 * Depends on: AA.MODES, AA.SHADERS (vsSource, buildFragmentSource, formatShaderError), AA.COLOR_UTILS
 *
 * Co-change guide
 *   New shared uniform -> shaders.js header + webgl-engine.js UNIFORM_NAMES + the fixed uniforms below
 */

  const W = 64;
  const H = 36;
  const TIMED_DRAWS = 20;
  const BASE_COLOR = [0.06, 0.36, 0.27];
  const round = (v, digits) => {
    const k = Math.pow(10, digits);
    return Math.round(v * k) / k;
  };

  // Compiles and links vs + fs; returns { ok, program, shaders, compileMs, error }
  function buildProgram(gl, fsSource, lineMap) {
    const t0 = performance.now();
    const shaders = [];
    const compile = (type, source, isFragment) => {
      const shader = gl.createShader(type);
      shaders.push(shader);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
      const raw = gl.getShaderInfoLog(shader);
      return { error: isFragment ? AA.SHADERS.formatShaderError(raw, lineMap) : raw };
    };

    const vs = compile(gl.VERTEX_SHADER, AA.SHADERS.vsSource, false);
    const fs = compile(gl.FRAGMENT_SHADER, fsSource, true);
    const failed = vs.error || fs.error;
    if (failed) {
      return { ok: false, program: null, shaders, compileMs: performance.now() - t0, error: failed };
    }
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
    const compileMs = performance.now() - t0;
    if (!linked) {
      return { ok: false, program, shaders, compileMs, error: gl.getProgramInfoLog(program) };
    }
    return { ok: true, program, shaders, compileMs, error: '' };
  }

  function release(gl, built) {
    if (!built) return;
    if (built.program) gl.deleteProgram(built.program);
    built.shaders.forEach(s => gl.deleteShader(s));
  }

  AA.diagnoseModes = function diagnoseModes() {
    const modes = AA.MODES || [];
    const bootCompileMs = typeof AA._bootCompileMs === 'number' ? AA._bootCompileMs : null;
    const result = { bootCompileMs, fullCompileMs: null, modes: [] };

    if (modes.length === 0) {
      console.warn('[AA.diagnoseModes] No background modes registered.');
      result.error = 'no modes registered';
      return result;
    }

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const gl = canvas.getContext('webgl2', {
      antialias: false,
      alpha: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: true

      console.warn('[AA.diagnoseModes] WebGL2 is not available.');
      result.error = 'webgl2 unavailable';

    }

    const color2 = AA.COLOR_UTILS.deriveSecondaryColor(BASE_COLOR, false, true, 67);
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.viewport(0, 0, W, H);

    const setUniforms = program => {
      const loc = n => gl.getUniformLocation(program, n);
      gl.useProgram(program);
      gl.uniform2f(loc('u_resolution'), W, H);
      gl.uniform1f(loc('u_time'), 12.34);
      gl.uniform1f(loc('u_time2'), 0.0);
      gl.uniform1f(loc('u_timeMix'), 0.0);
      gl.uniform3fv(loc('u_color'), BASE_COLOR);
      gl.uniform3fv(loc('u_color2'), color2);
      gl.uniform1fv(loc('u_weights'), [1.0]);
      gl.uniform1f(loc('u_brightness'), 1.0);
      gl.uniform1f(loc('u_vignette'), 1.0);
      gl.uniform1i(loc('u_octaves'), 4);
    };

    const sync = () => {
      gl.finish();
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
    };

    // Fresh compile of the full all-modes shader (does not touch AA.SHADERS.lastLineMap)
    const fullMap = [];
    const fullSource = AA.SHADERS.buildFragmentSource({ modes: modes.slice(), outLineMap: fullMap });
    const full = buildProgram(gl, fullSource, fullMap);
    result.fullCompileMs = round(full.compileMs, 2);
    if (!full.ok) console.error('[AA.diagnoseModes] Full shader failed to build:\n' + full.error);
    release(gl, full);
    if (result.bootCompileMs === null) result.bootCompileMs = result.fullCompileMs;

    const rows = modes.map(mode => {
      const lineMap = [];
      const source = AA.SHADERS.buildFragmentSource({ modes: [mode], outLineMap: lineMap });
      const built = buildProgram(gl, source, lineMap);
      const row = {
        id: mode.id,
        passed: built.ok,
        avgLuminance: null,
        frameMs: null,
        compileMs: round(built.compileMs, 2)
      };
      if (!built.ok) {
        console.error('[AA.diagnoseModes] Mode "' + mode.id + '" failed to build:\n' + built.error);
        release(gl, built);
        return row;
      }

      setUniforms(built.program);

      // Warm-up draw, then a timed batch
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      sync();
      const t0 = performance.now();
      for (let i = 0; i < TIMED_DRAWS; i++) gl.drawArrays(gl.TRIANGLES, 0, 3);
      sync();
      row.frameMs = round((performance.now() - t0) / TIMED_DRAWS, 3);

      const pixels = new Uint8Array(W * H * 4);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
      let sum = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        sum += 0.2126 * pixels[i] + 0.7152 * pixels[i + 1] + 0.0722 * pixels[i + 2];
      }
      row.avgLuminance = round(sum / (W * H * 255), 4);

      release(gl, built);
      return row;
    });

    gl.bindVertexArray(null);
    gl.deleteVertexArray(vao);
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();

    result.modes = rows;
    if (typeof console.table === 'function') console.table(rows);
    else console.log(rows);
    console.log('[AA.diagnoseModes] bootCompileMs=' + result.bootCompileMs + ' fullCompileMs=' + result.fullCompileMs + ' modes=' + rows.length + ' passed=' + rows.filter(r => r.passed).length);
    return result;
  };
})(window.AA);

          const entry = BINDING_BY_ID[e.target.id];
          if (entry) ui.store.setState(entry[0], e.target.checked);
        }
      });

      on(document, 'click', e => {
        const t = e.target;
        const isBg = t.id === 'custom-color-input';
        const isTc = !!(t.classList && t.classList.contains('tc-input'));
        if (!isBg && !isTc) return;
        e.preventDefault();
        cp.toggle(isBg ? THEME_KEY : t.dataset.prop, t, e.detail === 0);
      }, { capture: true });

      on(document, 'pointerdown', e => {
        if (!cp.isOpen()) return;
        const t = e.target;
        if (
          cp.el.contains(t) ||
          (t.classList && (t.classList.contains('tc-input') || t.id === 'custom-color-input'))
        ) {
          return;
        }
        cp.close();
      }, { passive: true });

      ui.store.subscribe('isPanelOpen', (_, val) => {
        if (!val) {
          cp.close();
          resetSeg();
          endSlide();
        }
      });

      on(window, 'resize', () => cp.reposition());

      on(document, 'click', e => {
        const segBtn = e.target.closest('.segment-btn');
        const swatch = e.target.closest('.swatch-wrapper[data-rgb]');
        const tabBtn = e.target.closest('.tab-nav-btn');
        const anchorBtn = e.target.closest('.anchor-btn');
        const mtgBtn = e.target.closest('.mtg-btn');

        if (e.target.closest('.icon-btn')) haptic(15);

        if (tabBtn) {
          const i = +tabBtn.dataset.tab;
          if (i !== ui.activeTab) {
            haptic(10);
            ui.setTab(i);
          }
        } else if (mtgBtn) {
          haptic(10);
          const p = mtgBtn.dataset.prop;
          ui.store.setState(p, !ui.store.getState()[p]);
        } else if (anchorBtn) {
          if (!holdFired && !anchorBtn.classList.contains('active')) {
            haptic(10);
            ui.store.setState(ANCHOR_KEY, +anchorBtn.dataset.value);
          }
          holdFired = false;
        } else if (segBtn && !segBtn.classList.contains('active')) {
          applySeg(segBtn.closest('.segmented-control').dataset.prop, segBtn);
        } else if (swatch) {
          haptic(10);
          ui.store.setState(THEME_KEY, swatch.dataset.rgb.split(',').map(Number));
        } else {
          ui._chrome.handleShellClick(e);
        }

        ui.wakeUp();
        ui.requestWakeLock();
      });

      on(window, 'blur', () => {
        ui.exitApp(false);
        endSlide();
      });
    }

    return { bindEvents, trackGlassPtr };
  };
})(window.AA);

// === js/ui-manager/ui-manager.js ===
/*
 * ui-manager.js - central UI coordinator
 *
 * Role
 *   Owns the shared DOM/state fields, constructs and initializes every UI subsystem in a fixed
 *   order, runs the declarative syncUI (schema -> CSS vars / hooks / controls / dependent rows,
 *   including the typoAnim crossfade), and keeps the thin delegation methods that other modules
 *   (schema/*.js hooks, main.js, color-picker.js, ui-chrome.js, gesture-manager.js, panel-view.js)
 *   still call on the UIManager instance.
 *
 * Statics
 *   FONTS (font-family stacks), hexToRgb, rgbToHex, renderIcon. Everything else is read directly from
 *   AA.DICT / AA.UI_CONFIG by the modules that need it (no forwarding getters on UIManager).
 *
 * Subsystem construction order (constructor)
 *   _hud            <- AA.createHUD            (hud.js)
 *   _chrome         <- AA.createChrome         (ui-chrome.js)
 *   displayLifecycle<- AA.createDisplayLifecycle (display-lifecycle.js)
 *   fx              <- AA.createUIFx           (ui-fx.js)
 *   controls        <- AA.createControlsRegistry (controls-registry.js)
 *   panelView       <- AA.createPanelView      (panel-view.js)
 *   gestures        <- AA.createGestureManager (gesture-manager.js)
 *
 * Initialization order (init)
 *   _chrome.initIcons() -> fx.init() -> _hud.init() -> renderPanel() -> syncUI(true)
 *   -> this._cp = AA.createColorPicker(this) -> bindEvents() -> runPixelShift() -> wakeUp()
 *   -> requestWakeLock() -> synthetic window 'resize'
 *
 * Event binding order (bindEvents)
 *   1. gestures.bindEvents()          panel scroll (capture), pointer*, click/change capture guards,
 *                                     color-picker triggers, main bubble click, window blur
 *   2. _chrome.bindEvents()           Escape, window resize, fullscreenchange, Space hold-to-exit
 *   3. displayLifecycle.bindEvents()  user-activity wake listeners
 *
 * Shared this.* fields (read/written across submodules)
 *   store, panel
 *   activeTab                  written by panelView.setTab; read by panelView.renderPanel, gestures
 *   _cp                        created in init(); read by hud, ui-chrome, panelView, gestures
 *   ptrX, ptrY, ptrActiveUntil written by gestures.trackGlassPtr; read by fx.tickGlass
 *   touchStartX, touchStartY   written by gestures and ui-chrome; read by gestures
 *   glassEls                   populated by fx.init(); read by fx
 *   typoAnim                   managed by syncUI
 *   appContainer, bgLayer, clockLayerObj, clockEl, clockWrapperEl, btnLowpower  cached DOM refs
 */
(function (AA) {
  const { $, clamp } = AA.util;
  const { EASE_OUT } = AA.CONST;
  const { FONTS, SETTINGS_SCHEMA, SCHEMA_BY_KEY } = AA.UI_CONFIG;

  class UIManager {
    // === Static Accessors & Color/Icon Utilities ===
    static get FONTS() {
      return FONTS;
    }

    static hexToRgb(h) {
      return [
        parseInt(h.slice(1, 3), 16) / 255,
        parseInt(h.slice(3, 5), 16) / 255,
        parseInt(h.slice(5, 7), 16) / 255
      ];
    }

    static rgbToHex(r, g, b) {
      return `#${[r, g, b].map(x => clamp(Math.round(x * 255), 0, 255).toString(16).padStart(2, '0')).join('')}`;
    }

    // === Lifecycle & Initialization ===
    constructor(store) {
      this.store = store;
      this.panel = $('settings-panel');
      this.activeTab = 0;
      this.appContainer = $('app-container');
      this.bgLayer = $('bg-layer');
      this.clockLayerObj = $('clock-layer');
      this.touchStartX = 0;
      this.touchStartY = 0;
      this.typoAnim = null;
      this.clockEl = $('clock');
      this.clockWrapperEl = $('clock-wrapper');
      this.btnLowpower = $('btn-lowpower');
      this.ptrX = -0.65;
      this.ptrY = -0.75;
      this.ptrActiveUntil = 0;
      this.glassEls = null;
      this._cp = null;
      this._hud = AA.createHUD(this);
      this._chrome = AA.createChrome(this);
      this.displayLifecycle = AA.createDisplayLifecycle(this);
      this.fx = AA.createUIFx(this);
      this.controls = AA.createControlsRegistry(this);
      this.panelView = AA.createPanelView(this);
      this.gestures = AA.createGestureManager(this);

      this.store.subscribe(SETTINGS_SCHEMA.map(e => e.key), prop => {
        let skipAnim = false;
        if (prop === 'lang') {
          this.renderPanel();
          skipAnim = true;
        }
        this.syncUI(skipAnim, prop === 'lang' ? null : prop);
      });
    }

    init() {
      this._chrome.initIcons();

      this.fx.init();

      this._hud.init();

      this.renderPanel();
      this.syncUI(true);
      this._cp = AA.createColorPicker(this);
      this.bindEvents();
      this.runPixelShift();
      this.wakeUp();
      this.requestWakeLock();
      window.dispatchEvent(new Event('resize'));
    }

    // === HUD, FX & Display Lifecycle Delegation (logic in hud.js, ui-fx.js, display-lifecycle.js) ===
    syncFps(on) {
      this._hud.syncFps(on);
    }

    // === FX Delegation (ui-fx.js) ===
    applyVisualVars(full) {
      this.fx.applyVisualVars(full);
    }

    startGlassLoop() {
      this.fx.startGlassLoop();
    }

    stopGlassLoop() {
      this.fx.stopGlassLoop();
    }

    tryRequestGyro() {
      this.fx.tryRequestGyro();
    }

    // === Display Lifecycle Delegation (display-lifecycle.js) ===
    scheduleIdle() {
      this.displayLifecycle.scheduleIdle();
    }

    wakeUp() {
      this.displayLifecycle.wakeUp();
    }

    exitApp(isStarting) {
      this.displayLifecycle.exitApp(isStarting);
    }

    clearExitSequence() {
      this.displayLifecycle.clearExitSequence();
    }

    requestWakeLock() {
      return this.displayLifecycle.requestWakeLock();
    }

    releaseWakeLock() {
      this.displayLifecycle.releaseWakeLock();
    }

    runPixelShift() {
      this.displayLifecycle.runPixelShift();
    }

    // === Panel Rendering & Tab Navigation (delegated to panel-view.js) ===
    renderPanel() {
      this.panelView.renderPanel();
    }

    setTab(i) {
      this.panelView.setTab(i);
    }

    // === Slider, Toast & Segment Highlight Delegation (controls-registry.js) ===
    updateSliderFill(el) {
      this.controls.updateSliderFill(el);
    }

    showHUD(text) {
      this._hud.showHUD(text);
    }

    updateSegmentHighlight(container, val, skipAnim = false) {
      this.controls.updateSegmentHighlight(container, val, skipAnim);
    }

    // === Declarative UI Sync (dependent row animations in panel-view.js) ===
    syncUI(skipAnim = false, changedKey = null) {
      const state = this.store.getState();
      const full = changedKey === null;
      const changed = full ? null : SCHEMA_BY_KEY[changedKey];
      const ap = changed && changed.apply;
      const entries = full ? SETTINGS_SCHEMA : (changed ? [changed] : []);
      const root = document.documentElement;
      const sp = (k, v) => root.style.setProperty(k, v);

      if (full) this.panelView.cancelRowAnims();

      if (!full && !skipAnim && ap && ap.typoTarget) {
        const targetEl = ap.typoTarget === 'wrapper' ? this.clockWrapperEl : this.clockEl;
        if (this.typoAnim) {
          this.typoAnim.cancel();
          this.typoAnim = null;
        }
        if (targetEl) {
          const calm = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
          const ease = EASE_OUT;
          const outAnim = this.typoAnim = targetEl.animate(
            calm
              ? [{ opacity: 1 }, { opacity: 0 }]
              : [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(0.96)' }],
            { duration: 120, easing: ease, fill: 'forwards' }
          );
          outAnim.onfinish = () => {
            if (this.typoAnim !== outAnim) return;
            this.applyVisualVars(false);
            window.dispatchEvent(new Event('resize'));
            const inAnim = this.typoAnim = targetEl.animate(
              calm
                ? [{ opacity: 0 }, { opacity: 1 }]
                : [{ opacity: 0, transform: 'scale(1.03)' }, { opacity: 1, transform: 'scale(1)' }],
              { duration: 240, easing: ease }
            );
            outAnim.cancel();
            inAnim.onfinish = inAnim.oncancel = () => {
              if (this.typoAnim === inAnim) this.typoAnim = null;
            };
          };
        } else {
          this.applyVisualVars(false);
        }
      } else if (full || skipAnim || (ap && (ap.visual || ap.typoTarget))) {
        this.applyVisualVars(full);
      }

      const ran = new Set();
      entries.forEach(e => {
        const val = state[e.key];
        const a = e.apply;
        if (a) {
          if (a.cssVar) sp(a.cssVar, a.cssFormat ? a.cssFormat(val) : val);
          if (a.hook && !ran.has(a.hook)) {
            ran.add(a.hook);
            a.hook(val, state, this);
          }
        }
        this.controls.syncEntry(e, val, state, skipAnim);
      });

      this.panelView.syncDependents(state, full, changedKey, skipAnim);
    }

    static renderIcon(paths, cls = '', size = 0) {
      return `<svg${cls ? ` class="${cls}"` : ''}${size ? ` width="${size}" height="${size}"` : ''} viewBox="0 0 24 24"${size ? ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' : ''}>${paths}</svg>`;
    }

    // === Event Binding Delegation (gesture-manager.js) ===
    bindEvents() {
      this.gestures.bindEvents();
      this._chrome.bindEvents();
      this.displayLifecycle.bindEvents();
    }
  }

  AA.UIManager = UIManager;
})(window.AA);

// === js/main.js ===
(function (AA) {
  const { $, on } = AA.util;
  const { Store, WebGLEngine, ClockController, UIManager } = AA;

  function initPWA() {
    const metaCap = document.createElement('meta');
    metaCap.name = 'apple-mobile-web-app-capable';
    metaCap.content = 'yes';

    const metaStatus = document.createElement('meta');
    metaStatus.name = 'apple-mobile-web-app-status-bar-style';
    metaStatus.content = 'black-translucent';

    document.head.append(metaCap, metaStatus);

    const cvs = document.createElement('canvas');
    cvs.width = 512;
    cvs.height = 512;
    const ctx = cvs.getContext('2d');

    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.roundRect(0, 0, 512, 512, 112);
    ctx.fill();

    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#371e78');
    grad.addColorStop(1, '#0a82a8');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(256, 256, 160, 0, Math.PI * 2);
    ctx.fill();

    const iconUrl = cvs.toDataURL('image/png');

    const appleIcon = document.createElement('link');
    appleIcon.rel = 'apple-touch-icon';
    appleIcon.href = iconUrl;
    document.head.appendChild(appleIcon);

    const manifest = {
      name: "Ambient Aurora",
      short_name: "Aurora",
      start_url: location.href,
      display: "standalone",
      background_color: "#000000",
      theme_color: "#000000",
      icons: [{ src: iconUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };

    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(manifestLink);

    const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});`;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
  }

  initPWA();

  const defaultState = AA.UI_CONFIG.buildDefaultState();

  const store = new Store(defaultState);
  const glEngine = new WebGLEngine($('gl-canvas'), store);
  const clockController = new ClockController($('clock-layer'), store, $('settings-panel'));
  const uiManager = new UIManager(store);

  uiManager.init();
  glEngine.start();
  clockController.start();

  on(document, 'visibilitychange', () => {
    if (document.hidden) {
      uiManager.releaseWakeLock();
      uiManager.stopGlassLoop();
      glEngine.pause();
      clockController.pause();
      store.flush();
    } else {
      uiManager.requestWakeLock();
      uiManager.startGlassLoop();
      glEngine.resume();
      clockController.resume();
    }
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.remove('no-transitions');
    clockController.updateEvasion();
  }));
})(window.AA);
  </script>
